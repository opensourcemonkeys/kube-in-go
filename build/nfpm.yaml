# ==========================================
# 1. PACKAGE METADATA
# ==========================================
name: "kube-inspector"
version: "${VERSION}"
version_schema: none
arch: "amd64"
platform: "linux"
maintainer: "hakanyorulmaz"
description: "A visual desktop client for managing Kubernetes clusters."
homepage: "https://kubeinspector.com"
license: "GPL-3.0"
vendor: "hakanyorulmaz"

# ==========================================
# 2. PACKAGE CONTENTS
# ==========================================
contents:
  # Linux binary (deb and rpm only)
  - src: "./build/bin/kube-inspector"
    dst: "/usr/local/bin/kube-inspector"
    packager: deb
    file_info:
      mode: 0o755

  - src: "./build/bin/kube-inspector"
    dst: "/usr/local/bin/kube-inspector"
    packager: rpm
    file_info:
      mode: 0o755

  # GNOME / KDE application menu shortcut (deb and rpm only)
  - src: "./build/kube-inspector.desktop"
    dst: "/usr/share/applications/kube-inspector.desktop"
    packager: deb
    file_info:
      mode: 0o644

  - src: "./build/kube-inspector.desktop"
    dst: "/usr/share/applications/kube-inspector.desktop"
    packager: rpm
    file_info:
      mode: 0o644

  # Application icon for Linux system menu (deb and rpm only)
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/kube-inspector.png"
    packager: deb
    file_info:
      mode: 0o644

  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/kube-inspector.png"
    packager: rpm
    file_info:
      mode: 0o644


overrides:
  deb:
    depends:
      - "libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0"
  rpm:
    depends:
      - (webkit2gtk4.0 or webkit2gtk4.1)
