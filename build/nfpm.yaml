# Linux packaging for the shipped GUI, which is the Electron shell.
#
# electron-builder *builds* (into build/electron); nfpm *packages* (into dist/).
# electron-builder's own deb/rpm targets shell out to dpkg/fakeroot/rpmbuild,
# which do not exist on Fedora or any non-Debian machine; nfpm is pure Go.
#
# The Wails shell is a development-only alternative and is no longer packaged.

# ==========================================
# 1. PACKAGE METADATA
# ==========================================
name: "kube-inspector"
version: "${VERSION}"
version_schema: none
arch: "amd64"
platform: "linux"
maintainer: "hakanyorulmaz"
description: "A visual desktop client for managing Kubernetes clusters."
homepage: "https://kubeinspector.com"
license: "GPL-3.0"
vendor: "hakanyorulmaz"

# ==========================================
# 2. PACKAGE CONTENTS
# ==========================================
contents:
  # The whole Electron app tree: the Electron runtime, our shell scripts in
  # app.asar, and resources/kube-inspector — the Go sidecar, which embeds and
  # serves the frontend and does all the Kubernetes work.
  - src: "./build/electron/linux-unpacked"
    dst: "/opt/kube-inspector"
    type: tree

  - src: "/opt/kube-inspector/kube-inspector"
    dst: "/usr/bin/kube-inspector"
    type: symlink

  - src: "./build/kube-inspector.desktop"
    dst: "/usr/share/applications/kube-inspector.desktop"
    file_info:
      mode: 0o644

  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/kube-inspector.png"
    file_info:
      mode: 0o644

# chrome-sandbox must end up setuid root or the app aborts at startup. It cannot
# be expressed in contents: nfpm rejects a second entry for a path the `tree`
# already supplied, and a non-root build user cannot assign root ownership.
scripts:
  postinstall: ./build/electron-postinstall.sh

# No `depends`: Electron bundles its own Chromium. Dropping the libwebkit2gtk
# dependency the Wails packages carried is the entire point of this shell — and
# it is why one package now works on every distro.
#
# kubectl is deliberately NOT a dependency. "Apply YAML" used to shell out to
# it, which silently did not work on a clean machine; it now runs server-side
# apply through client-go's dynamic client (internal/services/applyYamlServices.go).
# Do not reintroduce a subprocess here — the app talks to the API server itself.
