[pytest]
# Registering markers turns an unknown-mark warning into a real, selectable
# marker — `pytest -m "not integration"` only filters reliably once the marker
# is declared here.
markers =
    integration: needs a live cluster with create/delete rights in the default namespace

# Fail the run on an unregistered mark rather than warning, so a typo in a
# decorator cannot silently skip nothing.
addopts = --strict-markers
