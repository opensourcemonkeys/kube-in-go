name: Build & Release

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ==========================================
  # STAGE 1: BUILD & PACKAGE
  # ==========================================

  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build and Package
        run: |
          make pkg-deb
          make pkg-rpm

      - name: Rename Packages with Platform
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv dist/kube-ins_${VERSION}_amd64.deb dist/kube-ins-${VERSION}-debian-amd64.deb
          mv dist/kube-ins-${VERSION}-1.x86_64.rpm dist/kube-ins-${VERSION}-rhel-x86_64.rpm

      - name: Upload Linux Packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: dist/

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install NSIS
        run: |
          winget install NSIS.NSIS --silent --accept-source-agreements
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        run: make build-windows

      - name: Rename Installer with Version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv build/bin/kube-ins-amd64-installer.exe build/bin/kube-ins-${VERSION}-windows-amd64.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: build/bin/*-windows-amd64.exe

  # ==========================================
  # STAGE 2: RELEASE
  # ==========================================

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Linux Packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: dist/

      - name: Download Windows Installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist/

      - name: Extract Release Notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        if: github.ref_type == 'tag'
        with:
          body_path: /tmp/release_notes.md
          files: "dist/*"
