name: Build & Release

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'kube-ins-linux-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-22.04'
          - name: 'kube-ins-windows-amd64'
            platform: 'windows/amd64'
            os: 'windows-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Binary
        run: wails build -platform ${{ matrix.build.platform }} -clean

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.build.name }}
          path: build/bin/

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: false

      - name: Make Linux Binary Executable
        run: chmod +x dist/kube-ins-linux-amd64/kube-ins

      - name: Package Artifacts into ZIPs
        run: |
          cd dist
          for dir in */; do
            dirname=$(basename "$dir")
            echo "Zipping $dirname..."
            (cd "$dirname" && zip -r "../$dirname.zip" .)
          done

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        if: github.ref_type == 'tag'
        with:
          body_path: CHANGELOG.md
          files: "dist/*.zip"
