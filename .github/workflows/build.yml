name: Wails build

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'App-linux-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'App-windows-amd64'
            platform: 'windows/amd64'
            os: 'windows-latest'
          - name: 'App-darwin-universal'
            platform: 'darwin/universal'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Install Go Lang
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 2. Install Node.js (Required by Wails frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Wails CLI dependencies on Linux (required for compilation)
      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # 4. Install Wails CLI
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 5. Run the actual compilation safely without packaging wrappers
      - name: Build Binary
        run: wails build -platform ${{ matrix.build.platform }} -clean

      # 6. Upload cleanly using official v4 uploader
      - name: Upload Binaries (v4 Fix)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: build/bin/