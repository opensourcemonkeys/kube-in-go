name: Build & Release

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'App-linux-amd64'
            platform: 'linux/amd64'
            os: 'ubuntu-22.04'
            artifact_path: 'build/bin/*'
          - name: 'App-windows-amd64'
            platform: 'windows/amd64'
            os: 'windows-latest'
            artifact_path: 'build/bin/*'
          - name: 'App-darwin-universal'
            platform: 'darwin/universal'
            os: 'macos-latest'
            artifact_path: 'build/bin/*.dmg'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Binary & Package
        run: |
          if [ "${{ matrix.build.os }}" = "macos-latest" ]; then
            wails build -platform ${{ matrix.build.platform }} -clean -package
          else
            wails build -platform ${{ matrix.build.platform }} -clean
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}
          path: ${{ matrix.build.artifact_path }}

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: CHANGELOG.md
          files: "dist/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}