name: Build & Release

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  # ==========================================
  # STAGE 1: BUILD & PACKAGE
  # ==========================================

  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build and Package
        run: |
          make pkg-deb
          make pkg-rpm

      - name: Rename Packages with Platform
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv dist/kube-ins_${VERSION}_amd64.deb dist/kube-ins-${VERSION}-debian-amd64.deb
          mv dist/kube-ins-${VERSION}-1.x86_64.rpm dist/kube-ins-${VERSION}-rhel-x86_64.rpm

      - name: Upload Linux Packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: dist/

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install NSIS
        run: |
          winget install NSIS.NSIS --silent --accept-source-agreements
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        run: make build-windows

      - name: Rename Installer with Version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mv build/bin/kube-ins-amd64-installer.exe build/bin/kube-ins-${VERSION}-windows-amd64.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: build/bin/*-windows-amd64.exe

  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build and Package
        run: make pkg-mac

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: dist/*-macos-universal.dmg

  # ==========================================
  # STAGE 2: RELEASE
  # ==========================================

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Linux Packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: dist/

      - name: Download Windows Installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: dist/

      - name: Download macOS DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-dmg
          path: dist/

      - name: Extract Release Notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        if: github.ref_type == 'tag'
        with:
          body_path: /tmp/release_notes.md
          files: "dist/*"

  # ==========================================
  # STAGE 3: END-TO-END TESTS
  # ==========================================
  # Runs the Selenium E2E suite against the live Wails dev server, backed by an
  # ephemeral kind cluster. Not gated to the release job: GUI E2E can be flaky
  # and should not block publishing. To gate releases, add `e2e` to release.needs.

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: '3.12'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@facf10a55b9caf92e0cc749b4f82bf8220989148 # v1.7.2
        with:
          install-chromedriver: false

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend (satisfies //go:embed all:frontend/dist)
        run: |
          cd frontend
          npm ci
          npm run build
        # frontend/dist is gitignored, so a fresh checkout has no dist/. The Go
        # binary embeds it via //go:embed in main.go, so `wails dev` cannot compile
        # without it. Building once here populates dist/; dev still serves live
        # content from the Vite watcher.

      - name: Create kind cluster
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0

      - name: Provision kube-ins cluster config
        run: |
          mkdir -p ~/.kube-ins
          # kind-action's default cluster name is 'chart-testing'.
          kind get kubeconfig --name chart-testing > ~/.kube-ins/ci.yaml
          # The Go backend init() reads .active and selects this cluster on boot.
          printf 'ci' > ~/.kube-ins/.active
          # Give the Logs/Exec panel tests a real pod to act on (otherwise they skip).
          kubectl run nginx --image=nginx --restart=Never
          kubectl wait --for=condition=Ready pod/nginx --timeout=120s || true

      - name: Start Wails dev server (xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" make dev > /tmp/wails-dev.log 2>&1 &
          WAILS_PID=$!
          echo "wails dev started (pid $WAILS_PID); waiting for http://localhost:34115 ..."
          # Up to ~10 min: the first cold compile of client-go is slow.
          for i in $(seq 1 120); do
            # Fail fast if the dev process died (e.g. Go compile / embed error).
            if ! kill -0 "$WAILS_PID" 2>/dev/null; then
              echo "::error::wails dev exited before becoming ready — log below:"
              cat /tmp/wails-dev.log || true
              exit 1
            fi
            if curl -sf http://localhost:34115 >/dev/null; then
              echo "Wails dev server is up."
              exit 0
            fi
            echo "--- attempt $i/120, recent log: ---"
            tail -n 5 /tmp/wails-dev.log || true
            sleep 5
          done
          echo "::error::Wails dev server did not become ready in time — full log below:"
          cat /tmp/wails-dev.log || true
          exit 1

      - name: Run E2E suite
        env:
          E2E_HEADLESS: '1'
        run: make test-e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: report.html

      - name: Upload Wails dev log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wails-dev-log
          path: /tmp/wails-dev.log
          if-no-files-found: ignore

  # ==========================================
  # STAGE 4: EMAIL E2E REPORT
  # ==========================================

  mail-report:
    name: Email E2E Report
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - name: Download E2E report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-report
          path: .

      - name: Send report via Gmail SMTP
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: kube-ins CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "kube-ins E2E ${{ needs.e2e.result }} — ${{ github.ref_name }}"
          html_body: |
            <h3>kube-ins E2E — ${{ needs.e2e.result }}</h3>
            <p>Tag <b>${{ github.ref_name }}</b> · run
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.run_id }}</a></p>
            <p>Full report attached (open <code>report.html</code> in a browser — failure screenshots are inline).</p>
          attachments: report.html
