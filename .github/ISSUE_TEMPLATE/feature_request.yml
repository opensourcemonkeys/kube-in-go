name: Feature request
description: Suggest something Kube Inspector should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you are trying to accomplish, not only which button you want — the underlying task often has a better answer than the first one that comes to mind.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what makes it awkward today.
      placeholder: |
        When a rollout is stuck I need to compare the old and new ReplicaSet, and today that means …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. A rough sketch is fine.
    validations:
      required: true

  - type: input
    id: kubectl
    attributes:
      label: The kubectl equivalent, if there is one
      description: A command that does this today makes the request concrete.
      placeholder: "kubectl rollout history deployment/api"
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - Desktop app (GUI)
        - Terminal UI (kube-inspector-cli)
        - Both
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including "I currently do it in kubectl and that is fine, it is just slow".
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I checked [Known limitations](https://kubeinspector.com/known-limitations/) — some absences are deliberate, and the reasoning there may be worth arguing with.
          required: true
