{% extends "base.html" %}

<!-- Expose the app version so the header version chip (version-chip.js) can read it. -->
{% block extrahead %}
  {{ super() }}
  {% if config.extra.app_version %}
  <meta name="ki-app-version" content="{{ config.extra.app_version }}">
  {% endif %}

  <!-- Sponsor link for the header pill (sponsor-chip.js). -->
  {% if config.extra.sponsor_url %}
  <meta name="ki-sponsor-url" content="{{ config.extra.sponsor_url }}">
  <meta name="ki-sponsor-label" content="{{ config.extra.sponsor_label | d('Sponsor', true) }}">
  {% endif %}

  <!-- Structured data (JSON-LD) — helps Google rich results and gives LLM search
       clean, machine-readable facts about the app. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "SoftwareApplication",
        "name": "Kube Inspector",
        "description": "{{ config.site_description }}",
        "url": "{{ config.site_url }}",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "downloadUrl": "{{ config.site_url }}downloads/",
        "softwareHelp": "{{ config.site_url }}getting-started/installation/",
        "screenshot": "{{ config.site_url }}assets/screenshots/pods.png",
        "image": "{{ config.site_url }}assets/logo.png"{% if config.extra.app_version %},
        "softwareVersion": "{{ config.extra.app_version }}"{% endif %},
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "keywords": "Kubernetes, kubectl GUI, Kubernetes desktop client, k8s dashboard, cluster management, pods, deployments, RBAC, vulnerability scan"
      },
      {
        "@type": "WebSite",
        "name": "{{ config.site_name }}",
        "url": "{{ config.site_url }}",
        "description": "{{ config.site_description }}"
      }
    ]
  }
  </script>
{% endblock %}
